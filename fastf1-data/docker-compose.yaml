services:
  db:
    build:
      context: ./docker
      dockerfile: Dockerfile_db
    restart: unless-stopped
    volumes:
      - ./docker/db:/var/lib/postgresql/data/
    env_file:
      - .env
    networks:
      default:
        aliases:
          - db
    ports:
      - "37420:5432"
    healthcheck:
      test: pg_isready -U airflow_user -d airflow_db
      start_period: 120s
      interval: 60s
      timeout: 5s
      retries: 5


  airflow:
    image: apache/airflow:slim-2.10.2-python3.12
    restart: on-failure:2
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_pass@db:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    networks:
      default:
        aliases:
          - airflow
    ports:
      - "37421:8080"
      - "37422:5555"
    volumes:
      - ./services/airflow/config:/opt/airflow/config
      - ./services/airflow/plugins:/opt/airflow/plugins
      - ./services/airflow/dags:/opt/airflow/dags
      - ./docker/airflow/logs:/opt/airflow/logs
    entrypoint:
      - /bin/bash
      - -c
      - |
        pip install psycopg2-binary
        airflow db init
        airflow users create \
          --username admin \
          --firstname FIRST_NAME \
          --lastname LAST_NAME \
          --role Admin \
          --email admin@example.com \
          --password admin
        airflow webserver
        airflow scheduler
    depends_on:
      db:
        condition: service_healthy