services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    shm_size: 512mb
    env_file:
      - .env
    volumes:
      - ./docker/db/:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
  
  airflow:
    image: apache/airflow:slim-2.10.2-python3.12
    restart: unless-stopped
    ports:
      - "37420:8080"
      - "37421:5555"
    volumes:
      - ./services/airflow/config:/opt/airflow/config
      - ./services/airflow/plugins:/opt/airflow/plugins
      - ./services/airflow/dags:/opt/airflow/dags
      - ./docker/airflow/logs:/opt/airflow/logs
    entrypoint:
      - /bin/bash
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --firstname FIRST_NAME \
          --lastname LAST_NAME \
          --role Admin \
          --email admin@example.com \
          --password admin
        airflow webserver